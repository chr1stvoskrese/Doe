name: Apply image description clipping

on:
  push:
    branches: [agent/borderless-description-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/borderless-description-work
          fetch-depth: 0

      - name: Apply clipping safeguards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css = Path('frontend/borderless-description.css')
          text = css.read_text(encoding='utf-8')

          text = text.replace(
              '    overflow: visible;\n    border: 0 !important;\n    background: transparent !important;\n}',
              '    overflow: clip !important;\n    border: 0 !important;\n    background: transparent !important;\n}',
              1,
          )

          marker = '/* Keep the resize cursor active for the entire drag, including when the\n'
          block = '''/* Hard boundary for manually resized images: the image and its wrapper\n   can never paint outside the current description viewport. */
html body .task-detail-body .description-wrapper .image-resizer-wrapper {
    max-width: calc(100% - var(--description-scrollbar-width, 0px) - var(--description-scrollbar-gap, 0px)) !important;
    max-height: 100% !important;
    overflow: hidden !important;
    box-sizing: border-box !important;
}

html body .task-detail-body .description-wrapper .image-resizer-wrapper img {
    max-width: 100% !important;
    max-height: 100% !important;
    height: auto !important;
    object-fit: contain !important;
    box-sizing: border-box !important;
}

'''
          if block.strip() not in text:
              if marker not in text:
                  raise SystemExit('CSS insertion marker not found')
              text = text.replace(marker, block + marker, 1)

          css.write_text(text, encoding='utf-8')
          PY

      - name: Validate files and remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/fix-image-resize-bounds.yml .github/workflows/apply-image-description-clip.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/borderless-description.css .github/workflows/fix-image-resize-bounds.yml .github/workflows/apply-image-description-clip.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: hard-limit images to description viewport"
          git push origin agent/borderless-description-work
