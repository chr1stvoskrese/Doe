name: Apply description divider v3

on:
  push:
    branches: [agent/borderless-description-work]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/borderless-description-work
          fetch-depth: 0
      - name: Patch
        env:
          JS_B64: ""
          CSS_B64: ""
        run: |
          python3 -c "import base64; from pathlib import Path; p=Path('frontend/app.js'); s=p.read_text(); marker='    let lastSavedValue = \"\";'; ins=base64.b64decode('${JS_B64}').decode(); assert marker in s; assert 'descriptionDividerBound' not in s; p.write_text(s.replace(marker, ins+'\\n'+marker, 1))"
          python3 -c "import base64; from pathlib import Path; p=Path('frontend/borderless-description.css'); p.write_text(p.read_text().rstrip()+'\\n\\n'+base64.b64decode('${CSS_B64}').decode()+'\\n')"
      - name: Validate
        run: node --check frontend/app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.js frontend/borderless-description.css
          git commit -m "feat: add centered description resize divider"
          git rm .github/workflows/apply-description-divider-v3.yml
          git commit -m "chore: remove temporary divider workflow"
          git push origin agent/borderless-description-work
