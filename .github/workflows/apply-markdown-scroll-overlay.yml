name: Apply markdown scroll overlay

on:
  push:
    branches:
      - agent/borderless-description-work

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/borderless-description-work
          fetch-depth: 0

      - name: Add stylesheet link
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="borderless-description.css?v=1">'
          link = '    <link rel="stylesheet" href="description-scroll-overlay.css?v=1">'

          if link not in text:
              if marker not in text:
                  raise SystemExit('borderless stylesheet marker not found')
              text = text.replace(marker, marker + '\n' + link, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html .github/workflows/apply-markdown-scroll-overlay.yml
          git commit -m "chore: load markdown scroll overlay stylesheet"
          git rm .github/workflows/apply-markdown-scroll-overlay.yml
          git commit -m "chore: remove temporary markdown scroll workflow"
          git push origin agent/borderless-description-work
