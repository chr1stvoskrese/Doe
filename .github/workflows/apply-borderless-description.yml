name: Apply borderless description

on:
  push:
    branches:
      - agent/borderless-description-work

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/borderless-description-work
          fetch-depth: 0
      - name: Install borderless stylesheet
        run: |
          test -f frontend/borderless-description.css
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/index.html')
          text = path.read_text()
          marker = '    <link rel="stylesheet" href="styles.css?v=searchfix">'
          link = '    <link rel="stylesheet" href="styles.css?v=searchfix">\n    <link rel="stylesheet" href="borderless-description.css?v=1">'
          if 'borderless-description.css?v=1' not in text:
              if marker not in text:
                  raise SystemExit('styles.css link not found')
              text = text.replace(marker, link, 1)
              path.write_text(text)
          PY
      - name: Validate JavaScript
        run: node --check frontend/app.js
      - name: Commit changes and remove workflow
        run: |
          rm -f .github/workflows/apply-borderless-description.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html frontend/borderless-description.css .github/workflows/apply-borderless-description.yml
          git commit -m "style: make card descriptions borderless"
          git push origin agent/borderless-description-work
