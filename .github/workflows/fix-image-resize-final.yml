name: Final image resize cleanup

on:
  push:
    branches: [agent/borderless-description-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/borderless-description-work
          fetch-depth: 0

      - name: Fix image resize model and handle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('frontend/app.js')
          text = app.read_text(encoding='utf-8')

          # Do not mutate the description viewport width while the image is being resized.
          text = text.replace("                applyTextExpansion();\n            };\n\n            const onMouseUp", "            };\n\n            const onMouseUp", 1)
          text = text.replace("                lastSavedValue = cmEditor.getValue();\n                applyTextExpansion();\n\n                const taskId", "                lastSavedValue = cmEditor.getValue();\n\n                const taskId", 1)

          # Keep image height proportional when width is clamped by the live viewport.
          old = """                const visibleWidth = Math.min(desiredWidth, availableWidth);\n                const visibleHeight = desiredHeight;\n\n                wrapper.style.width = visibleWidth + 'px';\n                wrapper.style.height = visibleHeight + 'px';"""
          new = """                const visibleWidth = Math.min(desiredWidth, availableWidth);\n                const widthWasClamped = visibleWidth < desiredWidth;\n                const visibleHeight = widthWasClamped\n                    ? Math.max(50, visibleWidth / aspectRatio)\n                    : desiredHeight;\n\n                wrapper.style.width = visibleWidth + 'px';\n                wrapper.style.height = visibleHeight + 'px';"""
          if old not in text:
              raise SystemExit('resize visibility block not found')
          text = text.replace(old, new, 1)

          # Remove the duplicated collage toggle left by the earlier patch.
          dup = """            p.classList.toggle('image-collage', onlyImages);\n        }\n    });\n}\n"""
          if text.count(dup) > 0:
              pass
          text = text.replace("            }\n    // Без пустой строки подряд идущие изображения собираются в коллаж.\n    // Пустая строка создаёт отдельный <p>, поэтому такие изображения не объединяются.\n    p.classList.toggle('image-collage', onlyImages);\n        }", "            }\n        }", 1)

          app.write_text(text.rstrip() + '\n', encoding='utf-8')

          css = Path('frontend/borderless-description.css')
          css_text = css.read_text(encoding='utf-8')

          # Let the inline wrapper height be authoritative; only horizontal overflow is clamped.
          css_text = re.sub(
              r"/\* When the description gets narrower, the image follows it instead of keeping\n\s*\* an oversized inline width/height from a previous manual resize\. \*/\nhtml body \.task-detail-body \.markdown-body \.image-resizer-wrapper\.has-custom-size \{\n\s*height: auto !important;\n\}",
              '',
              css_text,
              count=1,
          )

          css_text = re.sub(
              r"html body \.task-detail-body \.markdown-body \.image-resizer-wrapper\.has-custom-size img \{\n\s*max-width: 100% !important;\n\s*height: auto !important;\n\s*box-sizing: border-box !important;\n\}",
              "html body .task-detail-body .markdown-body .image-resizer-wrapper.has-custom-size img {\n    width: 100% !important;\n    height: 100% !important;\n    max-width: 100% !important;\n    box-sizing: border-box !important;\n}",
              css_text,
              count=1,
          )

          # The final vertical-clamp block should only constrain width, never height.
          css_text = re.sub(
              r"html body \.task-detail-body \.markdown-body \.image-resizer-wrapper\.has-custom-size \{\n\s*max-width: calc\(100% - var\(--description-scrollbar-width, 0px\) - var\(--description-scrollbar-gap, 0px\)\) !important;\n\s*box-sizing: border-box !important;\n\s*overflow: visible !important;\n\}",
              "html body .task-detail-body .markdown-body .image-resizer-wrapper.has-custom-size {\n    max-width: calc(100% - var(--description-scrollbar-width, 0px) - var(--description-scrollbar-gap, 0px)) !important;\n    box-sizing: border-box !important;\n    overflow: visible !important;\n}",
              css_text,
              count=1,
          )

          # Make the diagonal resize mark a stable arrowhead instead of a skewed corner.
          css_text = re.sub(
              r"\.image-resize-handle::after \{\n\s*content: '';\n\s*width: 8px;\n\s*height: 8px;\n\s*border-right: 2px solid white;\n\s*border-bottom: 2px solid white;\n\s*margin-top: -2px;\n\s*margin-left: -2px;\n\}",
              ".image-resize-handle::after {\n    content: '';\n    width: 8px;\n    height: 8px;\n    border-right: 2px solid white;\n    border-bottom: 2px solid white;\n    transform: rotate(45deg);\n    margin: 0 2px 2px 0;\n}",
              css_text,
              count=1,
          )

          css.write_text(css_text.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          node --check frontend/app.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-image-resize-final.yml
          git add frontend/app.js frontend/borderless-description.css frontend/styles.css .github/workflows/fix-image-resize-final.yml
          git commit -m "fix: stabilize image resize and handle rendering"
          git push origin agent/borderless-description-work
