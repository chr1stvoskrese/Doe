name: Apply Windows wrapper fix

on:
  push:
    branches:
      - agent/borderless-description-work

permissions:
  contents: write

jobs:
  patch-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch wrapper.py
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          path = Path('wrapper.py')
          text = path.read_text(encoding='utf-8')
          original = text

          # 1) Windows WebView2: never append a query string to a file:// URL.
          old = """    url = out.resolve().as_uri()\n    if launch_mode == 'vault':\n        url += '?mode=vault'\n    return url\n"""
          new = """    url = out.resolve().as_uri()\n    # Windows WebView2 may encode '?' from file:// URLs into the filename\n    # (%3F), producing ERR_FILE_NOT_FOUND. The mode is already injected into\n    # window.__doeLaunchMode, so no query string is needed on Windows.\n    if launch_mode == 'vault' and sys.platform != 'win32':\n        url += '?mode=vault'\n    return url\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif "if launch_mode == 'vault' and sys.platform != 'win32':" not in text:
              raise SystemExit('runtime_index_url pattern not found')

          # 2) All Doe UI windows are allowed to be visible on Windows. The
          # existing WindowAPI.reveal_window() applies the frameless/native styles.
          text = text.replace(
              "hidden=(not sys.platform.startswith('linux'))",
              "hidden=(sys.platform not in ('linux', 'win32'))",
          )

          # 3) Initial Windows window: reveal it from the native loaded event,
          # instead of relying on frontend JS to make the first window visible.
          start_marker = "start_url = runtime_index_url('board' if is_configured else 'vault')"
          start_pos = text.find(start_marker)
          if start_pos < 0:
              raise SystemExit('start_url marker not found')

          bind_anchor = "        bind_resize_event(window)"
          bind_pos = text.find(bind_anchor, start_pos)
          if bind_pos < 0:
              raise SystemExit('initial bind_resize_event anchor not found')

          handler = """        if sys.platform == 'win32':\n            def _reveal_windows_startup(*_args):\n                try:\n                    window.show()\n                    window.restore()\n                    # Reuse Doe's existing Win32 style/foreground logic.\n                    WindowAPI().reveal_window()\n                    print('[WebView] Windows initial window revealed.', flush=True)\n                except Exception as exc:\n                    print(f'[WebView] Windows initial reveal failed: {exc}', flush=True)\n\n            try:\n                window.events.loaded += _reveal_windows_startup\n            except Exception as exc:\n                print(f'[WebView] Windows loaded handler registration failed: {exc}', flush=True)\n\n"""
          if "[WebView] Windows initial window revealed." not in text[start_pos:bind_pos + len(bind_anchor) + 600]:
              text = text[:bind_pos] + handler + text[bind_pos:]

          # 4) With the vault query removed on Windows, detect the vault selector
          # from its runtime filename/title instead of only mode=vault in the URL.
          old = """                    try:\n                        _cur_url = window.get_current_url() or ''\n                        is_resizable = 'mode=vault' not in _cur_url\n                    except Exception:\n                        is_resizable = \"Select Vault\" not in window.title\n"""
          new = """                    try:\n                        _cur_url = window.get_current_url() or ''\n                        _is_vault_window = (\n                            'mode=vault' in _cur_url\n                            or 'doe_runtime_vault.html' in _cur_url\n                            or window.title == 'Doe — Select Vault'\n                        )\n                        is_resizable = not _is_vault_window\n                    except Exception:\n                        is_resizable = \"Select Vault\" not in window.title\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif "_is_vault_window" not in text:
              raise SystemExit('Windows style detection pattern not found')

          if text == original:
              raise SystemExit('wrapper.py was not changed')

          path.write_text(text, encoding='utf-8')
          subprocess.run(['python', '-m', 'py_compile', 'wrapper.py'], check=True)
          print('wrapper.py patched and syntax check passed')

      - name: Remove temporary diagnostic launchers
        shell: bash
        run: |
          rm -f windows_entry.py sitecustomize.py

      - name: Commit wrapper fix and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wrapper.py windows_entry.py sitecustomize.py .github/workflows/apply-windows-wrapper-fix.yml
          git commit -m "fix: make Windows launch work directly from wrapper.py"
          git rm .github/workflows/apply-windows-wrapper-fix.yml
          git commit -m "chore: remove temporary wrapper patch workflow"
          git push
