name: Verified image resize cleanup
on:
  push:
    branches: [agent/borderless-description-work]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/borderless-description-work
          fetch-depth: 0
      - name: Apply verified resize fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('frontend/app.js')
          text = app.read_text(encoding='utf-8')

          old_block = '''                const wrapperRect = wrapper.getBoundingClientRect();
                const viewportRect = renderDiv.getBoundingClientRect();
                const availableWidth = Math.max(50, viewportRect.right - wrapperRect.left);

                // Horizontal size is constrained by the live description viewport.
                // Vertical size is NOT constrained by the current description height:
                // the description itself grows to make room for the image.
                const visibleWidth = Math.min(desiredWidth, availableWidth);
                const widthWasClamped = visibleWidth < desiredWidth;
                const visibleHeight = widthWasClamped
                    ? Math.max(50, visibleWidth / aspectRatio)
                    : desiredHeight;

                wrapper.style.width = visibleWidth + 'px';
                wrapper.style.height = visibleHeight + 'px';'''
          new_block = '''                const wrapperRect = wrapper.getBoundingClientRect();
                const viewportRect = renderDiv.getBoundingClientRect();
                const availableWidth = Math.max(50, viewportRect.right - wrapperRect.left);

                // Width is constrained by the live description viewport.
                // Height is free: the description wrapper grows to fit the image.
                const visibleWidth = Math.min(desiredWidth, availableWidth);
                const widthWasClamped = visibleWidth < desiredWidth;
                const visibleHeight = widthWasClamped
                    ? Math.max(50, visibleWidth / aspectRatio)
                    : desiredHeight;

                wrapper.style.width = `${visibleWidth}px`;
                wrapper.style.height = `${visibleHeight}px`;

                if (descWrapper) {
                    const descRect = descWrapper.getBoundingClientRect();
                    const liveWrapperBottom = wrapper.getBoundingClientRect().bottom;
                    const requiredHeight = Math.ceil(liveWrapperBottom - descRect.top + 18);
                    if (requiredHeight > descRect.height) {
                        descWrapper.style.height = `${requiredHeight}px`;
                    }
                }'''
          if old_block not in text:
              raise SystemExit('EXPECTED APP RESIZE BLOCK NOT FOUND')
          text = text.replace(old_block, new_block, 1)
          if text.count('const visibleWidth = Math.min(desiredWidth, availableWidth);') != 1:
              raise SystemExit('APP RESIZE BLOCK COUNT INVALID')
          app.write_text(text.rstrip() + '\n', encoding='utf-8')

          css = Path('frontend/borderless-description.css')
          text = css.read_text(encoding='utf-8')

          old_img = '''html body .task-detail-body .markdown-body .image-resizer-wrapper.has-custom-size img {
    max-width: 100% !important;
    width: auto !important;
    height: auto !important;
    object-fit: contain !important;
    box-sizing: border-box !important;
}'''
          new_img = '''html body .task-detail-body .markdown-body .image-resizer-wrapper.has-custom-size img {
    display: block !important;
    width: 100% !important;
    height: 100% !important;
    max-width: 100% !important;
    max-height: none !important;
    object-fit: fill !important;
    box-sizing: border-box !important;
}'''
          if old_img not in text:
              raise SystemExit('EXPECTED CUSTOM IMAGE CSS NOT FOUND')
          text = text.replace(old_img, new_img, 1)

          old_handle = '''.image-resize-handle::after {
    content: '';
    width: 8px;
    height: 8px;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
    margin-top: -2px;
    margin-left: -2px;
}'''
          new_handle = '''.image-resize-handle::after {
    content: '';
    width: 9px;
    height: 9px;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
    transform: rotate(45deg);
    margin: -1px 1px 1px -1px;
}'''
          if old_handle not in text:
              raise SystemExit('EXPECTED HANDLE CSS NOT FOUND')
          text = text.replace(old_handle, new_handle, 1)

          old_v = '''html body .task-detail-body .markdown-body .image-resizer-wrapper.has-custom-size {
    max-width: calc(100% - var(--description-scrollbar-width, 0px) - var(--description-scrollbar-gap, 0px)) !important;
    box-sizing: border-box !important;
    overflow: visible !important;
}'''
          new_v = '''html body .task-detail-body .markdown-body .image-resizer-wrapper.has-custom-size {
    width: var(--image-render-width, auto);
    height: var(--image-render-height, auto);
    max-width: calc(100% - var(--description-scrollbar-width, 0px) - var(--description-scrollbar-gap, 0px)) !important;
    min-height: 50px;
    box-sizing: border-box !important;
    overflow: visible !important;
}'''
          if old_v not in text:
              raise SystemExit('EXPECTED CUSTOM WRAPPER CSS NOT FOUND')
          text = text.replace(old_v, new_v, 1)

          css.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Validate exact changes
        run: |
          node --check frontend/app.js
          grep -q 'width: 100% !important;' frontend/borderless-description.css
          grep -q 'height: 100% !important;' frontend/borderless-description.css
          grep -q 'transform: rotate(45deg);' frontend/borderless-description.css
          grep -q 'description itself grows to make room for the image' frontend/app.js
          git diff --check
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/fix-image-resize-verified.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app.js frontend/borderless-description.css .github/workflows/fix-image-resize-verified.yml
          git commit -m 'fix: verify image resize geometry and handle'
          git push origin agent/borderless-description-work
