name: Fix image resize bounds

on:
  push:
    branches: [agent/borderless-description-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/borderless-description-work
          fetch-depth: 0

      - name: Patch image resize bounds
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/app.js')
          text = path.read_text(encoding='utf-8')

          if 'const descriptionWrapper = wrapper.closest(\'.description-wrapper\');' not in text:
              marker = "            const aspectRatio = startWidth / startHeight;"
              if marker not in text:
                  raise SystemExit('image resize aspect ratio marker not found')
              text = text.replace(
                  marker,
                  marker + "\n            const descriptionWrapper = wrapper.closest('.description-wrapper');",
                  1,
              )

          if 'const bounds = descriptionWrapper?.getBoundingClientRect();' not in text:
              pattern = re.compile(
                  r"(?P<indent>\s*)const onMouseMove = \(moveEvent\) => \{\n"
                  r"(?P<body>.*?wrapper\.style\.height = newHeight \+ 'px';)",
                  re.S,
              )
              match = pattern.search(text)
              if not match:
                  raise SystemExit('image resize mousemove handler not found')

              indent = match.group('indent')
              replacement = f'''{indent}const onMouseMove = (moveEvent) => {{
{indent}    let newWidth = Math.max(50, startWidth + (moveEvent.clientX - startX));
{indent}    let newHeight = Math.max(50, startHeight + (moveEvent.clientY - startY));

{indent}    const bounds = descriptionWrapper?.getBoundingClientRect();
{indent}    const maxWidth = Math.max(50, (bounds?.width || wrapper.parentElement?.clientWidth || newWidth));
{indent}    const maxHeight = Math.max(50, (bounds?.height || wrapper.parentElement?.clientHeight || newHeight));

{indent}    if (moveEvent.shiftKey) {{
{indent}        newWidth = Math.min(newWidth, maxWidth, maxHeight * aspectRatio);
{indent}        newHeight = newWidth / aspectRatio;
{indent}    }} else {{
{indent}        newWidth = Math.min(newWidth, maxWidth);
{indent}        newHeight = Math.min(newHeight, maxHeight);
{indent}    }}

{indent}    wrapper.style.width = newWidth + 'px';
{indent}    wrapper.style.height = newHeight + 'px';'''
              text = text[:match.start()] + replacement + text[match.end():]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check frontend/app.js

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-image-resize-bounds.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.js .github/workflows/fix-image-resize-bounds.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: clamp image resize to description bounds"
          git push origin agent/borderless-description-work
