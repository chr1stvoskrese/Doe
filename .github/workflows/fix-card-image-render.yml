name: Fix card image rendering

on:
  push:
    branches:
      - agent/fix-card-image-render

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch markdown worker attachment root
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/app.js')
          text = path.read_text(encoding='utf-8')

          old = """        self.__DOE_ATTACH = ${JSON.stringify(window.__DOE_ATTACH || '')};\n        // Загружаем библиотеки парсинга напрямую в поток\n"""
          new = """        self.__DOE_ATTACH = '';\n        // Загружаем библиотеки парсинга напрямую в поток\n"""
          if old not in text:
              raise SystemExit('snapshot attachment-root block not found')
          text = text.replace(old, new, 1)

          old = """        self.onmessage = function(e) {\n            const { id, text } = e.data;\n            const html = parseMarkdownWithMathWorker(text);\n"""
          new = """        self.onmessage = function(e) {\n            const { id, text, attach } = e.data;\n            self.__DOE_ATTACH = attach || '';\n            const html = parseMarkdownWithMathWorker(text);\n"""
          if old not in text:
              raise SystemExit('worker message handler not found')
          text = text.replace(old, new, 1)

          old = "    markdownWorker.postMessage({ id: currentId, text: text });"
          new = "    markdownWorker.postMessage({ id: currentId, text: text, attach: window.__DOE_ATTACH || '' });"
          if old not in text:
              raise SystemExit('worker postMessage call not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate JavaScript patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/app.js').read_text(encoding='utf-8')
          checks = [
              "const { id, text, attach } = e.data;",
              "self.__DOE_ATTACH = attach || '';",
              "attach: window.__DOE_ATTACH || ''",
          ]
          for item in checks:
              if item not in p:
                  raise SystemExit(f'missing patched text: {item}')
          print('patch validation passed')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-card-image-render.yml
          git add frontend/app.js .github/workflows/fix-card-image-render.yml
          git commit -m "fix: render attached images in card descriptions"
          git push origin HEAD:agent/fix-card-image-render
