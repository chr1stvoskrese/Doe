name: Disable image resizing in collages

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/agent/collage-no-resize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collage-no-resize
          fetch-depth: 0

      - name: Patch app.js
        run: |
          python3 -c "from pathlib import Path; p=Path('frontend/app.js'); s=p.read_text(encoding='utf-8'); marker=\"            p.classList.toggle('image-collage', onlyImages);\"; patch=marker+\"\\n            if (onlyImages) {\\n                p.querySelectorAll('.image-resizer-wrapper').forEach(wrap => {\\n                    wrap.classList.remove('has-custom-size', 'is-resizing');\\n                    wrap.style.removeProperty('width');\\n                    wrap.style.removeProperty('height');\\n                    wrap.querySelector('.image-resize-handle')?.remove();\\n                    delete wrap.dataset.justResized;\\n                });\\n            }\"; assert marker in s; p.write_text(s.replace(marker, patch, 1), encoding='utf-8')"

      - name: Patch styles.css
        run: |
          python3 -c "from pathlib import Path; p=Path('frontend/styles.css'); s=p.read_text(encoding='utf-8'); anchor='.markdown-body p.image-collage .image-resizer-wrapper.has-custom-size {'; block='''/* Collage images are sized automatically; manual resizing is disabled. */\n.markdown-body p.image-collage .image-resizer-wrapper {\n    outline: none !important;\n    border: 0 !important;\n    width: 100% !important;\n    height: auto !important;\n    min-width: 0 !important;\n    max-width: none !important;\n    cursor: zoom-in !important;\n}\n.markdown-body p.image-collage .image-resizer-wrapper img {\n    width: 100% !important;\n    height: auto !important;\n    max-width: 100%;\n    object-fit: contain !important;\n}\n.markdown-body p.image-collage .image-resize-handle {\n    display: none !important;\n}\n'''; assert anchor in s; p.write_text(s.replace(anchor, block+'\\n'+anchor, 1), encoding='utf-8')"

      - name: Validate JavaScript
        run: node --check frontend/app.js

      - name: Commit patch and clean up
        run: |
          rm -f .github/workflows/disable-collage-resizer.yml frontend/.collage-patch-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/app.js frontend/styles.css .github/workflows/disable-collage-resizer.yml frontend/.collage-patch-trigger
          git commit -m 'fix: disable manual resizing inside image collages'
          git push origin agent/collage-no-resize
