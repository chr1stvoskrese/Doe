name: Disable image resizing in collages

on:
  push:
    branches: [agent/collage-no-resize]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/collage-no-resize
          fetch-depth: 0

      - name: Patch collage rendering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('frontend/app.js')
          text = app.read_text(encoding='utf-8')

          marker = "            p.classList.toggle('image-collage', onlyImages);"
          patch = """            p.classList.toggle('image-collage', onlyImages);
            if (onlyImages) {
                // Коллажи управляются только CSS-сеткой: убираем ручной ресайзер
                // и любые ранее сохранённые inline-размеры.
                p.querySelectorAll('.image-resizer-wrapper').forEach(wrap => {
                    wrap.classList.remove('has-custom-size', 'is-resizing');
                    wrap.style.removeProperty('width');
                    wrap.style.removeProperty('height');
                    wrap.querySelector('.image-resize-handle')?.remove();
                    delete wrap.dataset.justResized;
                });
            }"""
          if marker not in text:
              raise SystemExit('collage marker not found in app.js')
          text = text.replace(marker, patch, 1)
          app.write_text(text, encoding='utf-8')

          css = Path('frontend/styles.css')
          text = css.read_text(encoding='utf-8')
          block = '''
/* ============================================================
   🧩 Коллажи не используют ручной ресайзер.
   Размеры автоматически распределяются сеткой по ширине описания.
   ============================================================ */
.markdown-body p.image-collage .image-resizer-wrapper {
    resize: none !important;
    outline: none !important;
    border: 0 !important;
    width: 100% !important;
    height: auto !important;
    min-width: 0 !important;
    max-width: none !important;
    cursor: zoom-in !important;
}

.markdown-body p.image-collage .image-resizer-wrapper img {
    width: 100% !important;
    height: auto !important;
    max-width: 100%;
    object-fit: contain !important;
}

.markdown-body p.image-collage .image-resize-handle,
.markdown-body p.image-collage .image-resizer-wrapper.is-resizing .image-resize-handle {
    display: none !important;
}
'''
          anchor = '.markdown-body p.image-collage .image-resizer-wrapper.has-custom-size {\n'
          if anchor not in text:
              raise SystemExit('collage CSS anchor not found in styles.css')
          text = text.replace(anchor, block + '\n' + anchor, 1)
          css.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check frontend/app.js

      - name: Commit changes and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/disable-collage-resizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.js frontend/styles.css .github/workflows/disable-collage-resizer.yml
          git commit -m "fix: disable manual resizing inside image collages"
          git push origin agent/collage-no-resize
