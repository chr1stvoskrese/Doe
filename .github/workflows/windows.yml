name: windows

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Patch Windows native drag
        shell: pwsh
        run: |
          $p = 'wrapper.py'
          $s = Get-Content $p -Raw
          $old = @'
                        def custom_wndproc(h, msg, wp, lp):
                            if msg == WM_NCCALCSIZE and wp:
                                return 0
                            return call_wnd_proc(old_proc, h, msg, wp, lp)
'@
          $new = @'
                        WM_NCHITTEST = 0x0084
                        HTCAPTION = 2
                        HTCLIENT = 1

                        def custom_wndproc(h, msg, wp, lp):
                            if msg == WM_NCCALCSIZE and wp:
                                return 0
                            if msg == WM_NCHITTEST:
                                y_screen = ctypes.c_short((lp >> 16) & 0xFFFF).value
                                rect = wintypes.RECT()
                                if ctypes.windll.user32.GetWindowRect(h, ctypes.byref(rect)):
                                    local_y = y_screen - rect.top
                                    if 0 <= local_y < 42:
                                        return HTCAPTION
                                return HTCLIENT
                            return call_wnd_proc(old_proc, h, msg, wp, lp)
'@
          if ($s.Contains($old)) {
            $s = $s.Replace($old, $new)
            Set-Content -Path $p -Value $s -Encoding UTF8
            python -m py_compile wrapper.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add wrapper.py
            git commit -m 'fix: restore native Windows drag hit testing'
            git push
          } else {
            Write-Host 'Native drag hit-test patch already present or target moved.'
          }

      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Build Windows executable
        shell: pwsh
        run: >-
          python build.py --target windows
          --features search,calendar,reminders,graph,tabs,deadlines,export,priority,automations,statistics,memory

      - name: Verify frozen executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\Doe\Doe.exe'
          if (-not (Test-Path $exe)) { throw "Doe.exe was not produced: $exe" }
          $item = Get-Item $exe
          if ($item.Length -lt 100KB) { throw "Doe.exe looks suspiciously small: $($item.Length) bytes" }
          $past = '2000-01-01T00:00:00'
          & $exe '--worker' $past 'CI smoke' 'CI smoke' '1' 'C:\__doe_ci_missing_vault__' 'ci-smoke'
          if ($LASTEXITCODE -ne 0) { throw "Frozen worker startup failed with exit code $LASTEXITCODE" }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Doe-windows
          path: dist/Doe/
          if-no-files-found: error
