name: windows

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Patch Windows borderless window drag
        shell: pwsh
        run: |
          $p = 'wrapper.py'
          $s = Get-Content $p -Raw
          $pattern = '(?s)    def start_window_drag\(self\):.*?(?=\n    def start_window_resize\(self\):)'
          $replacement = @"
          def start_window_drag(self):
              """Старт перетаскивания Windows-окна без зависимости от native title bar."""
              import sys
              if sys.platform != 'win32':
                  return False
              try:
                  return bool(self.begin_win_move())
              except Exception as e:
                  print(f"[WebView] start_window_drag failed: {e}", flush=True)
                  return False
          "@
          $new = [regex]::Replace($s, $pattern, $replacement.TrimEnd(), 1)
          if ($new -eq $s) {
            Write-Host 'Windows drag already patched.'
          } else {
            Set-Content -Path $p -Value $new -Encoding UTF8
            Write-Host 'Patched wrapper.py.'
            python -m py_compile wrapper.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add wrapper.py
            git commit -m 'fix: restore Windows borderless window dragging'
            git push
          }

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        shell: pwsh
        run: python -m pytest -q

      - name: Install runtime dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Build Windows executable
        shell: pwsh
        run: >-
          python build.py --target windows
          --features search,calendar,reminders,graph,tabs,deadlines,export,priority,automations,statistics,memory

      - name: Verify frozen executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\Doe\Doe.exe'
          if (-not (Test-Path $exe)) { throw "Doe.exe was not produced: $exe" }
          $item = Get-Item $exe
          if ($item.Length -lt 100KB) { throw "Doe.exe looks suspiciously small: $($item.Length) bytes" }
          $past = '2000-01-01T00:00:00'
          & $exe '--worker' $past 'CI smoke' 'CI smoke' '1' 'C:\__doe_ci_missing_vault__' 'ci-smoke'
          if ($LASTEXITCODE -ne 0) { throw "Frozen worker startup failed with exit code $LASTEXITCODE" }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Doe-windows
          path: dist/Doe/
          if-no-files-found: error
