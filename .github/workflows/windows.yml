name: windows-patch

on:
  push:
    branches:
      - 'agent/**'

permissions:
  contents: write

jobs:
  patch-wrapper:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch wrapper.py native Windows drag
        shell: pwsh
        run: |
          $p = 'wrapper.py'
          $s = Get-Content $p -Raw

          $old = @'
                        def custom_wndproc(h, msg, wp, lp):
                            if msg == WM_NCCALCSIZE and wp:
                                return 0
                            return call_wnd_proc(old_proc, h, msg, wp, lp)
'@

          $new = @'
                        WM_NCHITTEST = 0x0084
                        HTCAPTION = 2
                        HTCLIENT = 1

                        def custom_wndproc(h, msg, wp, lp):
                            if msg == WM_NCCALCSIZE and wp:
                                return 0
                            if msg == WM_NCHITTEST:
                                y_screen = ctypes.c_short((lp >> 16) & 0xFFFF).value
                                rect = wintypes.RECT()
                                if ctypes.windll.user32.GetWindowRect(h, ctypes.byref(rect)):
                                    local_y = y_screen - rect.top
                                    if 0 <= local_y < 42:
                                        return HTCAPTION
                                return HTCLIENT
                            return call_wnd_proc(old_proc, h, msg, wp, lp)
'@

          if (-not $s.Contains($old)) {
            Write-Host 'Target custom_wndproc not found or already patched.'
            exit 0
          }

          $s = $s.Replace($old, $new)
          Set-Content -Path $p -Value $s -Encoding UTF8
          python -m py_compile wrapper.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wrapper.py
          git commit -m 'fix: restore native Windows drag hit testing'
          git push
