name: Apply description resize handle

on:
  push:
    branches: [agent/borderless-description-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/borderless-description-work
          fetch-depth: 0

      - name: Patch description resize interaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('frontend/app.js')
          text = app.read_text(encoding='utf-8')

          marker = '''function initTaskDescriptionLogic() {
              const renderDiv = document.getElementById('task-desc-render');
              const inputArea = document.getElementById('task-desc-input');
              const descWrapper = document.querySelector('.description-wrapper');
              const modal = document.getElementById('task-modal');

              let lastSavedValue = "";'''

          insert = '''function initTaskDescriptionLogic() {
              const renderDiv = document.getElementById('task-desc-render');
              const inputArea = document.getElementById('task-desc-input');
              const descWrapper = document.querySelector('.description-wrapper');
              const modal = document.getElementById('task-modal');

              // Перетаскиваемая горизонтальная линия внизу описания заменяет
              // неочевидный нативный уголок resize. Сам ресайз идёт по вертикали.
              if (descWrapper && !descWrapper.dataset.resizeHandleBound) {
                  descWrapper.dataset.resizeHandleBound = '1';

                  const RESIZE_ZONE = 26;
                  const MIN_HEIGHT = 150;
                  let resizing = false;
                  let pointerId = null;
                  let startY = 0;
                  let startHeight = 0;
                  let previousCursor = '';
                  let previousUserSelect = '';

                  const isResizeZone = (event) => {
                      const rect = descWrapper.getBoundingClientRect();
                      return event.clientY >= rect.bottom - RESIZE_ZONE;
                  };

                  const clampHeight = (value) => {
                      const scrollParent = descWrapper.closest('.task-detail-body');
                      const parentHeight = scrollParent?.clientHeight || window.innerHeight;
                      const maxHeight = Math.max(MIN_HEIGHT + 40, parentHeight - 96);
                      return Math.max(MIN_HEIGHT, Math.min(value, maxHeight));
                  };

                  const stopResize = (event) => {
                      if (!resizing || (pointerId !== null && event?.pointerId !== pointerId)) return;

                      resizing = false;
                      pointerId = null;
                      descWrapper.classList.remove('is-description-resizing');
                      previousCursor && (document.body.style.cursor = previousCursor);
                      previousUserSelect && (document.body.style.userSelect = previousUserSelect);
                      if (!previousCursor) document.body.style.removeProperty('cursor');
                      if (!previousUserSelect) document.body.style.removeProperty('user-select');
                  };

                  descWrapper.addEventListener('pointermove', (event) => {
                      if (resizing) {
                          if (pointerId !== null && event.pointerId !== pointerId) return;
                          const nextHeight = clampHeight(startHeight + (event.clientY - startY));
                          descWrapper.style.height = `${nextHeight}px`;
                          return;
                      }

                      descWrapper.classList.toggle('is-description-resize-hover', isResizeZone(event));
                  });

                  descWrapper.addEventListener('pointerleave', () => {
                      if (!resizing) descWrapper.classList.remove('is-description-resize-hover');
                  });

                  descWrapper.addEventListener('pointerdown', (event) => {
                      if (event.button !== 0 || !isResizeZone(event)) return;

                      event.preventDefault();
                      event.stopPropagation();

                      resizing = true;
                      pointerId = event.pointerId;
                      startY = event.clientY;
                      startHeight = descWrapper.getBoundingClientRect().height;
                      previousCursor = document.body.style.cursor;
                      previousUserSelect = document.body.style.userSelect;

                      descWrapper.classList.add('is-description-resizing');
                      descWrapper.classList.remove('is-description-resize-hover');
                      document.body.style.cursor = 'ns-resize';
                      document.body.style.userSelect = 'none';

                      try {
                          descWrapper.setPointerCapture(event.pointerId);
                      } catch (_) {}
                  });

                  descWrapper.addEventListener('pointerup', stopResize);
                  descWrapper.addEventListener('pointercancel', stopResize);
                  descWrapper.addEventListener('lostpointercapture', stopResize);
              }

              let lastSavedValue = "";'''

          if marker not in text:
              raise SystemExit('description init marker not found in app.js')
          if 'dataset.resizeHandleBound' in text:
              raise SystemExit('description resize handle already patched')

          text = text.replace(marker, insert, 1)
          app.write_text(text, encoding='utf-8')

          css = Path('frontend/borderless-description.css')
          css_text = css.read_text(encoding='utf-8')
          css_marker = '/* Horizontal description resize affordance. */'
          css_block = '''

/* Horizontal description resize affordance. */
html body .description-wrapper {
    resize: none !important;
    position: relative;
}

html body .description-wrapper::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 5px;
    width: 52px;
    height: 3px;
    transform: translateX(-50%);
    border-radius: 999px;
    background: var(--text-secondary);
    opacity: 0.28;
    pointer-events: none;
    transition: width 0.18s ease, height 0.18s ease, opacity 0.18s ease;
    z-index: 20;
}

html body .description-wrapper.is-description-resize-hover::after,
html body .description-wrapper.is-description-resizing::after {
    width: 68px;
    height: 4px;
    opacity: 0.68;
}

html body .description-wrapper.is-description-resize-hover,
html body .description-wrapper.is-description-resizing {
    cursor: ns-resize !important;
}

html body .description-wrapper.is-description-resizing::after {
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.14);
}
'''

          if css_marker not in css_text:
              css.write_text(css_text.rstrip() + css_block + '\n', encoding='utf-8')

          Path('.github/workflows/apply-description-resize-handle.yml').unlink(missing_ok=True)
          PY

      - name: Validate JavaScript
        run: node --check frontend/app.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.js frontend/borderless-description.css .github/workflows/apply-description-resize-handle.yml
          git commit -m "feat: make description resize handle intuitive"
          git push origin agent/borderless-description-work
