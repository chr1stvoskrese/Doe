name: Apply description divider resize

on:
  push:
    branches: [agent/borderless-description-work]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/borderless-description-work
          fetch-depth: 0

      - name: Patch description divider
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('frontend/app.js')
          text = app.read_text(encoding='utf-8')

          if 'data-description-divider-bound' not in text:
              marker = '    let lastSavedValue = "";\n'
              insert = r'''    // Интуитивный ресайз описания: тонкая горизонтальная линия по центру
    // нижнего края блока служит одновременно визуальным разделителем и ручкой.
    if (descWrapper && !descWrapper.dataset.descriptionDividerBound) {
        descWrapper.dataset.descriptionDividerBound = '1';

        const RESIZE_ZONE = 22;
        const MIN_HEIGHT = 150;
        let dividerResizing = false;
        let dividerPointerId = null;
        let dividerStartY = 0;
        let dividerStartHeight = 0;
        let dividerPrevCursor = '';
        let dividerPrevUserSelect = '';

        const dividerInZone = (event) => {
            const rect = descWrapper.getBoundingClientRect();
            return event.clientY >= rect.bottom - RESIZE_ZONE;
        };

        const clampDividerHeight = (height) => {
            const scrollParent = descWrapper.closest('.task-detail-body');
            const available = scrollParent ? scrollParent.clientHeight : window.innerHeight;
            const maxHeight = Math.max(MIN_HEIGHT + 40, available - 96);
            return Math.max(MIN_HEIGHT, Math.min(height, maxHeight));
        };

        const endDividerResize = (event) => {
            if (!dividerResizing) return;
            if (dividerPointerId !== null && event && event.pointerId !== dividerPointerId) return;

            dividerResizing = false;
            dividerPointerId = null;
            descWrapper.classList.remove('is-description-resize-hover', 'is-description-resizing');
            document.body.style.cursor = dividerPrevCursor;
            document.body.style.userSelect = dividerPrevUserSelect;
        };

        descWrapper.addEventListener('pointermove', (event) => {
            if (dividerResizing) {
                if (dividerPointerId !== null && event.pointerId !== dividerPointerId) return;
                event.preventDefault();
                descWrapper.style.height = `${clampDividerHeight(dividerStartHeight + event.clientY - dividerStartY)}px`;
                return;
            }
            descWrapper.classList.toggle('is-description-resize-hover', dividerInZone(event));
        });

        descWrapper.addEventListener('pointerleave', () => {
            if (!dividerResizing) descWrapper.classList.remove('is-description-resize-hover');
        });

        descWrapper.addEventListener('pointerdown', (event) => {
            if (event.button !== 0 || !dividerInZone(event)) return;

            event.preventDefault();
            event.stopPropagation();
            dividerResizing = true;
            dividerPointerId = event.pointerId;
            dividerStartY = event.clientY;
            dividerStartHeight = descWrapper.getBoundingClientRect().height;
            dividerPrevCursor = document.body.style.cursor;
            dividerPrevUserSelect = document.body.style.userSelect;

            descWrapper.classList.add('is-description-resizing');
            descWrapper.classList.remove('is-description-resize-hover');
            document.body.style.cursor = 'ns-resize';
            document.body.style.userSelect = 'none';

            try { descWrapper.setPointerCapture(event.pointerId); } catch (_) {}
        });

        descWrapper.addEventListener('pointerup', endDividerResize);
        descWrapper.addEventListener('pointercancel', endDividerResize);
        descWrapper.addEventListener('lostpointercapture', endDividerResize);
    }

    let lastSavedValue = "";
'''
              if marker not in text:
                  raise SystemExit('description init marker not found')
              text = text.replace(marker, insert, 1)
              app.write_text(text, encoding='utf-8')

          css = Path('frontend/borderless-description.css')
          css_text = css.read_text(encoding='utf-8')
          start = css_text.find('/* The description keeps native vertical resizing')
          if start == -1:
              css_block = r'''

/* Description divider: visual end-of-content cue + vertical resize affordance. */
html body .description-wrapper {
    resize: none !important;
    position: relative;
    padding-bottom: 22px !important;
}

html body .description-wrapper::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 8px;
    width: 74px;
    height: 2px;
    transform: translateX(-50%);
    border-radius: 999px;
    background: var(--text-secondary);
    opacity: 0.34;
    pointer-events: none;
    transition: width 0.18s ease, height 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
    z-index: 20;
}

html body .description-wrapper.is-description-resize-hover::after,
html body .description-wrapper.is-description-resizing::after {
    width: 96px;
    height: 3px;
    opacity: 0.72;
}

html body .description-wrapper.is-description-resize-hover,
html body .description-wrapper.is-description-resizing {
    cursor: ns-resize !important;
}

html body .description-wrapper.is-description-resizing::after {
    box-shadow: 0 1px 7px rgba(0, 0, 0, 0.16);
}
'''
              css.write_text(css_text.rstrip() + css_block + '\n', encoding='utf-8')
          else:
              # Replace the old native corner-resizer block from its comment to EOF.
              css_text = css_text[:start].rstrip() + '\n' + r'''
/* Description divider: visual end-of-content cue + vertical resize affordance. */
html body .description-wrapper {
    resize: none !important;
    position: relative;
    padding-bottom: 22px !important;
}

html body .description-wrapper::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 8px;
    width: 74px;
    height: 2px;
    transform: translateX(-50%);
    border-radius: 999px;
    background: var(--text-secondary);
    opacity: 0.34;
    pointer-events: none;
    transition: width 0.18s ease, height 0.18s ease, opacity 0.18s ease, box-shadow 0.18s ease;
    z-index: 20;
}

html body .description-wrapper.is-description-resize-hover::after,
html body .description-wrapper.is-description-resizing::after {
    width: 96px;
    height: 3px;
    opacity: 0.72;
}

html body .description-wrapper.is-description-resize-hover,
html body .description-wrapper.is-description-resizing {
    cursor: ns-resize !important;
}

html body .description-wrapper.is-description-resizing::after {
    box-shadow: 0 1px 7px rgba(0, 0, 0, 0.16);
}
'''
              css.write_text(css_text.rstrip() + '\n', encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: node --check frontend/app.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app.js frontend/borderless-description.css .github/workflows/fix-description-divider.yml
          git commit -m "feat: add centered description resize divider"
          git push origin agent/borderless-description-work
